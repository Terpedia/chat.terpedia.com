<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>PubMed Reader | Terpedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f5f0;
      --paper: #fffefa;
      --ink: #252823;
      --muted: #687068;
      --line: #d9ddd5;
      --brand: #29735d;
      --brand-strong: #175b48;
      --wash: #e8f0e8;
      --shadow: 0 12px 36px rgba(30, 48, 39, 0.08);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: #24211d;
      --paper: #2d2a25;
      --ink: #f0eee8;
      --muted: #aaa9a1;
      --line: #484840;
      --brand: #73b99f;
      --brand-strong: #9bd0ba;
      --wash: #303c35;
      --shadow: 0 16px 44px rgba(0, 0, 0, 0.24);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    button, input { font: inherit; }
    a { color: inherit; }
    .site-header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(14px); }
    .header-inner { width: min(1120px, calc(100% - 32px)); height: 62px; margin: 0 auto; display: flex; align-items: center; gap: 18px; }
    .brand { color: var(--ink); font-family: "DM Serif Display", Georgia, serif; font-size: 24px; text-decoration: none; }
    .section-name { padding-left: 18px; border-left: 1px solid var(--line); color: var(--muted); font-family: Montserrat, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .pmid-form { display: flex; align-items: center; height: 34px; border: 1px solid var(--line); background: var(--paper); }
    .pmid-form input { width: 126px; height: 32px; border: 0; outline: 0; padding: 0 10px; background: transparent; color: var(--ink); font-size: 12px; }
    .pmid-form button, .icon-button, .chat-link { height: 34px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
    .pmid-form button { border-width: 0 0 0 1px; padding: 0 11px; color: var(--brand-strong); font-family: Montserrat, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .icon-button { width: 34px; display: grid; place-items: center; cursor: pointer; }
    .icon-button svg { width: 16px; height: 16px; }
    .chat-link { display: inline-flex; align-items: center; padding: 0 12px; color: var(--brand-strong); font-family: Montserrat, sans-serif; font-size: 9px; font-weight: 700; text-decoration: none; text-transform: uppercase; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .article-shell { display: grid; grid-template-columns: minmax(0, 760px) minmax(190px, 1fr); gap: 64px; align-items: start; padding: 64px 0 88px; }
    .article-kicker { margin: 0 0 17px; color: var(--brand-strong); font-family: Montserrat, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 0; max-width: 760px; font-family: "DM Serif Display", Georgia, serif; font-size: 58px; font-weight: 400; line-height: 1.05; letter-spacing: 0; }
    .authors { margin: 25px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .publication-line { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .publication-line strong { color: var(--ink); font-weight: 600; }
    .abstract { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 28px; }
    .abstract h2, .keywords h2 { margin: 0 0 18px; font-family: Montserrat, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .abstract-section { margin: 0 0 20px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.78; }
    .section-label { display: block; margin-bottom: 5px; color: var(--ink); font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; }
    .cyc-link { color: inherit; text-decoration-line: underline; text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--brand) 65%, transparent); text-underline-offset: 3px; }
    .cyc-link:hover { color: var(--brand-strong); text-decoration-style: solid; }
    .sidebar { position: sticky; top: 92px; border-top: 3px solid var(--brand); padding-top: 18px; }
    .fact { padding: 0 0 15px; margin: 0 0 15px; border-bottom: 1px solid var(--line); }
    .fact dt { margin-bottom: 5px; color: var(--muted); font-family: Montserrat, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .fact dd { margin: 0; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .fact a { color: var(--brand-strong); text-decoration: none; }
    .fact a:hover { text-decoration: underline; }
    .keywords { margin-top: 28px; }
    .keyword-list { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .keyword-list a { color: var(--muted); font-size: 11px; text-decoration: none; border-bottom: 1px dotted var(--brand); }
    .keyword-list a:hover { color: var(--brand-strong); }
    .status { min-height: calc(100vh - 62px); display: grid; place-items: center; text-align: center; }
    .status-inner { max-width: 520px; padding: 50px 20px; }
    .status h1 { font-size: 42px; }
    .status p { color: var(--muted); line-height: 1.65; }
    .status[hidden], .article-shell[hidden] { display: none; }
    .loader { width: 30px; height: 30px; margin: 0 auto 20px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .header-inner { width: min(100% - 20px, 1120px); gap: 10px; }
      .section-name, .pmid-form { display: none; }
      main { width: min(100% - 28px, 1120px); }
      .article-shell { grid-template-columns: 1fr; gap: 42px; padding: 38px 0 64px; }
      h1 { font-size: 38px; }
      .abstract { margin-top: 38px; }
      .abstract-section { font-size: 17px; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Terpedia</a>
      <span class="section-name">Research reader</span>
      <div class="header-actions">
        <form class="pmid-form" id="pmid-form"><input id="pmid-input" inputmode="numeric" pattern="[0-9]*" aria-label="PMID" placeholder="PMID"><button type="submit">Open</button></form>
        <a class="chat-link" href="/">Chat</a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Use dark mode" title="Use dark mode"></button>
      </div>
    </div>
  </header>
  <main>
    <section class="status" id="status"><div class="status-inner"><div class="loader" id="loader"></div><h1 id="status-title">Opening research</h1><p id="status-copy">Retrieving the publication record and its provenance.</p></div></section>
    <article class="article-shell" id="article" hidden>
      <div>
        <p class="article-kicker" id="kicker"></p>
        <h1 id="title"></h1>
        <p class="authors" id="authors"></p>
        <p class="publication-line" id="publication-line"></p>
        <section class="abstract"><h2>Abstract</h2><div id="abstract"></div></section>
      </div>
      <aside class="sidebar" aria-label="Publication details">
        <dl id="facts"></dl>
        <section class="keywords" id="keywords-section"><h2>Encyclopedia terms</h2><div class="keyword-list" id="keywords"></div></section>
      </aside>
    </article>
  </main>
  <script src="https://unpkg.com/lucide@1.24.0/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      'use strict';
      const API_BASE = 'https://api.terpedia.com';
      const CYC_BASE = 'https://cyc.terpedia.com/wiki/';
      const THEME_KEY = 'terpedia_chat_theme';
      const encyclopediaVocabulary = [
        'alpha-pinene', 'beta-pinene', 'beta-caryophyllene', 'caryophyllene', 'limonene', 'linalool', 'myrcene',
        'terpinolene', 'ocimene', 'humulene', 'bisabolol', 'nerolidol', 'geraniol', 'camphene', 'borneol',
        'eucalyptol', 'terpineol', 'valencene', 'phytol', 'farnesene', 'cannabis', 'cannabinoid', 'cannabinoids',
        'cannabidiol', 'tetrahydrocannabinol', 'CBD', 'THC'
      ];
      const els = Object.fromEntries(['status', 'loader', 'status-title', 'status-copy', 'article', 'kicker', 'title', 'authors', 'publication-line', 'abstract', 'facts', 'keywords-section', 'keywords', 'pmid-form', 'pmid-input', 'theme-toggle'].map(function (id) { return [id.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }), document.getElementById(id)]; }));

      function escapeHtml(value) { return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
      function cycUrl(term) { return CYC_BASE + encodeURIComponent(String(term).trim().replace(/\s+/g, '_')); }
      function relevantTerms(article) {
        const available = new Map(encyclopediaVocabulary.map(function (term) { return [term.toLowerCase(), term]; }));
        return Array.from(new Set((article.keywords || []).concat(encyclopediaVocabulary).map(function (term) { return available.get(String(term).toLowerCase()); }).filter(Boolean))).sort(function (a, b) { return b.length - a.length; });
      }
      function linkedText(value, terms, linked) {
        let output = escapeHtml(value);
        terms.forEach(function (term) {
          if (linked.has(term.toLowerCase())) return;
          const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const pattern = new RegExp('\\b(' + escaped + ')\\b', 'i');
          if (!pattern.test(output)) return;
          output = output.replace(pattern, function (match) { linked.add(term.toLowerCase()); return '<a class="cyc-link" href="' + cycUrl(term) + '">' + match + '</a>'; });
        });
        return output;
      }
      function fact(label, value) { return value ? '<div class="fact"><dt>' + escapeHtml(label) + '</dt><dd>' + value + '</dd></div>' : ''; }
      function render(article) {
        const terms = relevantTerms(article);
        const linked = new Set();
        document.title = article.title + ' | Terpedia';
        els.pmidInput.value = article.pmid;
        els.kicker.textContent = 'PubMed ' + article.pmid;
        els.title.textContent = article.title;
        els.authors.textContent = article.authors.join(', ');
        els.publicationLine.innerHTML = '<strong>' + escapeHtml(article.journal || article.journalAbbreviation || 'PubMed') + '</strong>' + (article.publicationDate ? ' · ' + escapeHtml(article.publicationDate) : '');
        const sections = article.abstractSections.length ? article.abstractSections : [{ label: '', text: article.abstract || 'No abstract is available for this record.' }];
        els.abstract.innerHTML = sections.map(function (section) { return '<p class="abstract-section">' + (section.label ? '<span class="section-label">' + escapeHtml(section.label) + '</span>' : '') + linkedText(section.text, terms, linked) + '</p>'; }).join('');
        const doiLink = article.doi ? '<a href="https://doi.org/' + encodeURIComponent(article.doi) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(article.doi) + '</a>' : '';
        els.facts.innerHTML = fact('PMID', escapeHtml(article.pmid)) + fact('DOI', doiLink) + fact('Publication type', escapeHtml(article.publicationTypes.join(', '))) + fact('Provenance', '<a href="' + escapeHtml(article.source.url) + '" target="_blank" rel="noopener noreferrer">View record at PubMed</a>');
        const articleText = (article.title + ' ' + article.abstract).toLowerCase();
        const presentTerms = terms.filter(function (term) { return articleText.includes(term.toLowerCase()); });
        els.keywords.innerHTML = presentTerms.map(function (term) { return '<a href="' + cycUrl(term) + '">' + escapeHtml(term) + '</a>'; }).join('');
        els.keywordsSection.hidden = !presentTerms.length;
        els.status.hidden = true;
        els.article.hidden = false;
      }
      function showError(title, copy) { els.loader.hidden = true; els.statusTitle.textContent = title; els.statusCopy.textContent = copy; els.article.hidden = true; els.status.hidden = false; }
      async function loadArticle() {
        const pmid = new URLSearchParams(location.search).get('pmid') || '';
        if (!/^\d{1,12}$/.test(pmid)) return showError('PMID needed', 'Add a numeric PMID to the address or open one from a Terpedia reference.');
        els.pmidInput.value = pmid;
        try {
          const response = await fetch(API_BASE + '/api/pubmed/' + encodeURIComponent(pmid));
          const payload = await response.json();
          if (!response.ok || !payload.article) throw new Error(payload.error || 'The publication could not be loaded.');
          render(payload.article);
        } catch (error) { showError('Publication unavailable', error.message || String(error)); }
      }
      function applyTheme(value) {
        const dark = value === 'dark' || (value === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#24211d' : '#f7f5f0';
        els.themeToggle.innerHTML = '<i data-lucide="' + (dark ? 'sun' : 'moon') + '"></i>';
        els.themeToggle.setAttribute('aria-label', dark ? 'Use light mode' : 'Use dark mode');
        els.themeToggle.title = dark ? 'Use light mode' : 'Use dark mode';
        if (window.lucide) window.lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
      }
      els.pmidForm.addEventListener('submit', function (event) { event.preventDefault(); const pmid = els.pmidInput.value.trim(); if (/^\d{1,12}$/.test(pmid)) location.href = '/pubmed?pmid=' + encodeURIComponent(pmid); });
      els.themeToggle.addEventListener('click', function () { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, next); applyTheme(next); });
      applyTheme(localStorage.getItem(THEME_KEY) || 'light');
      loadArticle();
    })();
  </script>
</body>
</html>
